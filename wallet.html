<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket — DICE Ticket Transfer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #111;
      min-height: 100vh;
      padding: 16px;
    }
    .ticket {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.12);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 70vh;
    }
    .header { font-size: 20px; font-weight: 700; }
    .subheader { font-size: 14px; color: #666; margin-top: 4px; }
    .tier { font-size: 13px; color: #888; margin-top: 2px; }
    .qr-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 0.5rem;
      position: relative;
    }
    .qr-wrap #qrcode {
      padding: 1rem;
      border: 4px solid #9a9a9a;
      background: #fff;
      animation: borderPulse 1.5s infinite;
      display: inline-block;
      line-height: 0;
    }
    .qr-wrap #qrcode img,
    .qr-wrap #qrcode canvas {
      display: block;
    }
    @keyframes borderPulse {
      0% { padding: 1rem; border-color: #9a9a9a; }
      100% { padding: 1.6rem; border-color: #d8d4d4; }
    }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }
    .footer .label { color: #888; font-size: 12px; margin-bottom: 2px; }
    .brand {
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #999;
    }
    .error {
      max-width: 420px;
      margin: 20vh auto;
      background: #fff;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.1);
      text-align: center;
    }
    .refresh-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .refresh-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
    .refresh-overlay p {
      color: #fff;
      font-size: 18px;
      text-align: center;
      padding: 0 2rem;
      line-height: 1.5;
    }
    .refresh-overlay button {
      margin-top: 0.4rem;
      padding: 14px 36px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #5b8cff, #3352af);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay" class="refresh-overlay" aria-hidden="true">
    <p>Your barcode has expired.</p>
    <button type="button" id="refreshBtn">Click Here to View Barcode</button>
  </div>
  <script src="./payload.js"></script>
  <script src="./qrcode.min.js"></script>
  <script>
    (function () {
      const app = document.getElementById("app");
      const overlay = document.getElementById("overlay");
      const refreshBtn = document.getElementById("refreshBtn");

      function showOverlay() {
        overlay.classList.add("visible");
        overlay.setAttribute("aria-hidden", "false");
      }

      refreshBtn.addEventListener("click", function () {
        window.location.reload();
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) showOverlay();
      });

      // Mirror SMP: force refresh after 15 minutes
      setTimeout(showOverlay, 15 * 60 * 1000);

      function formatTime(iso) {
        if (!iso) return "—";
        try {
          const date = new Date(iso);
          let hours = date.getHours();
          const minutes = String(date.getMinutes()).padStart(2, "0");
          const ampm = hours >= 12 ? "PM" : "AM";
          hours = hours % 12 || 12;
          return hours + ":" + minutes + " " + ampm;
        } catch (_) {
          return iso;
        }
      }

      function formatDate(iso) {
        if (!iso) return "";
        try {
          return new Date(iso).toLocaleDateString("en-US", {
            weekday: "short",
            month: "short",
            day: "numeric",
            year: "numeric",
          });
        } catch (_) {
          return "";
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      try {
        const data = DiceTicketTransfer.decodePayload(location.hash);

        app.innerHTML =
          '<div class="ticket">' +
          '<div>' +
          '<div class="header">' + escapeHtml(data.eventName || "Event") + "</div>" +
          '<div class="header">' + escapeHtml(data.ticketType || "Ticket") + "</div>" +
          (data.ticketTier
            ? '<div class="tier">' + escapeHtml(data.ticketTier) + "</div>"
            : "") +
          '<div class="subheader">Ticket ID ' + escapeHtml(String(data.ticketId || "")) + "</div>" +
          "</div>" +
          '<div class="qr-wrap"><div id="qrcode" role="img" aria-label="Ticket QR Code"></div></div>' +
          '<div class="footer">' +
          '<div><div class="label">WHERE</div><div>' +
          escapeHtml(data.venueName || "—") +
          "</div></div>" +
          '<div style="text-align:right"><div class="label">WHEN</div><div>' +
          escapeHtml(formatTime(data.eventDate)) +
          "</div><div class=\"subheader\">" +
          escapeHtml(formatDate(data.eventDate)) +
          "</div></div>" +
          "</div>" +
          '<div class="brand">DICE Ticket Transfer</div>' +
          "</div>";

        new QRCode(document.getElementById("qrcode"), {
          text: String(data.barcode),
          width: 180,
          height: 180,
          correctLevel: QRCode.CorrectLevel.M,
        });
      } catch (err) {
        app.innerHTML =
          '<div class="error"><h2>Unable to open ticket</h2><p style="margin-top:0.75rem;color:#666">' +
          escapeHtml(err.message || "Invalid link") +
          "</p></div>";
      }
    })();
  </script>
</body>
</html>
