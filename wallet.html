<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ticket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 28px;
    }
    .shell {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
    }
    .ticket {
      position: relative;
      background: #fff;
      border-radius: 18px;
      padding: 22px 20px 18px;
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }
    .ticket-top {
      padding-right: 28px;
    }
    .ticket-type {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #111;
    }
    .ticket-count {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #8a8a8a;
      text-transform: uppercase;
    }
    .info-dot {
      position: absolute;
      top: 18px;
      right: 16px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid #cfcfcf;
      color: #999;
      font-size: 12px;
      font-weight: 600;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .qr-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 8px 18px;
    }
    .qr-frame {
      position: relative;
      padding: 14px;
      background: #fff;
      display: inline-block;
      line-height: 0;
    }
    .qr-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid #bdbdbd;
      pointer-events: none;
      animation: qrPulse 1.6s ease-in-out infinite;
    }
    @keyframes qrPulse {
      0% {
        inset: 0;
        border-color: #9e9e9e;
        border-width: 3px;
      }
      100% {
        inset: -10px;
        border-color: #e0e0e0;
        border-width: 5px;
      }
    }
    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 200px !important;
      height: 200px !important;
    }
    .ticket-bottom {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      margin-top: 4px;
    }
    .meta .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9a9a9a;
      margin-bottom: 3px;
    }
    .meta .value {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      line-height: 1.25;
    }
    .meta-block + .meta-block {
      margin-top: 14px;
    }
    .dice-seal {
      width: 46px;
      height: 62px;
      border-radius: 6px;
      background:
        linear-gradient(145deg, #f7f3ff 0%, #d9ecff 35%, #ffe8f2 70%, #e8fff4 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 6px 4px 7px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }
    .dice-seal .mark {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      filter: grayscale(0.2);
    }
    .dice-seal .word {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #111;
    }
    .event-under {
      text-align: center;
      color: #8d8d8d;
      font-size: 13px;
      line-height: 1.45;
      padding: 0 8px;
    }
    .event-under .name {
      color: #bdbdbd;
      font-weight: 500;
    }
    .event-under .clock {
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
      color: #7a7a7a;
      font-size: 12px;
    }
    .error {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
    }
    .error h2 { font-size: 18px; margin-bottom: 8px; }
    .error p { color: #666; font-size: 14px; }
    .refresh-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .refresh-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
    .refresh-overlay p {
      color: #fff;
      font-size: 17px;
      text-align: center;
      padding: 0 2rem;
      line-height: 1.45;
    }
    .refresh-overlay button {
      margin-top: 0.25rem;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay" class="refresh-overlay" aria-hidden="true">
    <p>Your barcode has expired.</p>
    <button type="button" id="refreshBtn">Tap to view barcode</button>
  </div>
  <script src="./payload.js"></script>
  <script src="./qrcode.min.js"></script>
  <script>
    (function () {
      const app = document.getElementById("app");
      const overlay = document.getElementById("overlay");
      const refreshBtn = document.getElementById("refreshBtn");

      function showOverlay() {
        overlay.classList.add("visible");
        overlay.setAttribute("aria-hidden", "false");
      }

      refreshBtn.addEventListener("click", function () {
        window.location.reload();
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) showOverlay();
      });

      setTimeout(showOverlay, 15 * 60 * 1000);

      function formatWhen(iso) {
        if (!iso) return "—";
        try {
          const date = new Date(iso);
          let hours = date.getHours();
          const minutes = String(date.getMinutes()).padStart(2, "0");
          const ampm = hours >= 12 ? "pm" : "am";
          hours = hours % 12 || 12;
          const tz = Intl.DateTimeFormat("en-US", { timeZoneName: "short" })
            .formatToParts(date)
            .find(function (p) { return p.type === "timeZoneName"; });
          const tzLabel = tz && tz.value ? " " + tz.value.toLowerCase() : "";
          return hours + ":" + minutes + " " + ampm + tzLabel;
        } catch (_) {
          return String(iso);
        }
      }

      function formatClock(now) {
        try {
          return now.toLocaleString("en-US", {
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
          });
        } catch (_) {
          return "";
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      try {
        const data = DiceTicketTransfer.decodePayload(location.hash);
        const ticketType = data.ticketType || "Ticket";
        const when = formatWhen(data.eventDate);
        const where = data.venueName || "—";
        const eventName = data.eventName || "";
        const now = new Date();

        app.innerHTML =
          '<div class="shell">' +
          '<div class="ticket">' +
          '<div class="info-dot" aria-hidden="true">i</div>' +
          '<div class="ticket-top">' +
          '<div class="ticket-type">' + escapeHtml(ticketType) + "</div>" +
          '<div class="ticket-count">1 OF 1</div>' +
          "</div>" +
          '<div class="qr-wrap"><div class="qr-frame"><div id="qrcode" role="img" aria-label="Ticket QR Code"></div></div></div>' +
          '<div class="ticket-bottom">' +
          '<div class="meta">' +
          '<div class="meta-block"><div class="label">When</div><div class="value">' +
          escapeHtml(when) +
          "</div></div>" +
          '<div class="meta-block"><div class="label">Where</div><div class="value">' +
          escapeHtml(where) +
          "</div></div>" +
          "</div>" +
          '<div class="dice-seal" aria-hidden="true"><div class="mark">✦</div><div class="word">DICE</div></div>' +
          "</div>" +
          "</div>" +
          '<div class="event-under">' +
          (eventName
            ? '<div class="name">' + escapeHtml(eventName) + "</div>"
            : "") +
          '<div class="clock">Current time: ' +
          escapeHtml(formatClock(now)) +
          "</div>" +
          "</div>" +
          "</div>";

        new QRCode(document.getElementById("qrcode"), {
          text: String(data.barcode),
          width: 200,
          height: 200,
          correctLevel: QRCode.CorrectLevel.M,
        });

        // Live clock under the card (matches DICE feel)
        var clockEl = document.querySelector(".event-under .clock");
        if (clockEl) {
          setInterval(function () {
            clockEl.textContent = "Current time: " + formatClock(new Date());
          }, 1000);
        }
      } catch (err) {
        app.innerHTML =
          '<div class="error"><h2>Unable to open ticket</h2><p>' +
          escapeHtml(err.message || "Invalid link") +
          "</p></div>";
      }
    })();
  </script>
</body>
</html>
