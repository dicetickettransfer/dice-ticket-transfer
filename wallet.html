<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ticket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 28px;
    }
    .shell {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
    }
    .ticket {
      position: relative;
      background: #fff;
      border-radius: 18px;
      padding: 22px 20px 18px;
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }
    .ticket-top { padding-right: 28px; }
    .ticket-type {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #111;
    }
    .ticket-count {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #8a8a8a;
      text-transform: uppercase;
    }
    .info-dot {
      position: absolute;
      top: 18px;
      right: 16px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid #cfcfcf;
      color: #999;
      font-size: 12px;
      font-weight: 600;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .qr-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 8px 18px;
    }
    .qr-frame {
      position: relative;
      padding: 14px;
      background: #fff;
      display: inline-block;
      line-height: 0;
    }
    .qr-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid #bdbdbd;
      pointer-events: none;
      animation: qrPulse 1.6s ease-in-out infinite;
    }
    @keyframes qrPulse {
      0% { inset: 0; border-color: #9e9e9e; border-width: 3px; }
      100% { inset: -10px; border-color: #e0e0e0; border-width: 5px; }
    }
    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 200px !important;
      height: 200px !important;
    }
    .ticket-bottom {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      margin-top: 4px;
    }
    .meta .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9a9a9a;
      margin-bottom: 3px;
    }
    .meta .value {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      line-height: 1.25;
    }
    .meta-block + .meta-block { margin-top: 14px; }
    .dice-seal {
      width: 48px;
      height: 64px;
      border-radius: 7px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
      background:
        linear-gradient(135deg,
          #f4f7ff 0%,
          #d7ecff 22%,
          #f7e9ff 48%,
          #ffe8f3 70%,
          #e7fff5 100%);
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .dice-seal svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .event-under {
      text-align: center;
      color: #8d8d8d;
      font-size: 13px;
      line-height: 1.45;
      padding: 0 8px;
    }
    .event-under .name {
      color: #bdbdbd;
      font-weight: 500;
    }
    .event-under .clock {
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
      color: #7a7a7a;
      font-size: 12px;
    }
    .error {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
    }
    .error h2 { font-size: 18px; margin-bottom: 8px; }
    .error p { color: #666; font-size: 14px; }
    .refresh-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .refresh-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
    .refresh-overlay p {
      color: #fff;
      font-size: 17px;
      text-align: center;
      padding: 0 2rem;
      line-height: 1.45;
    }
    .refresh-overlay button {
      margin-top: 0.25rem;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay" class="refresh-overlay" aria-hidden="true">
    <p>Your barcode has expired.</p>
    <button type="button" id="refreshBtn">Tap to view barcode</button>
  </div>
  <script src="./payload.js"></script>
  <script src="./qrcode.min.js"></script>
  <script>
    (function () {
      const app = document.getElementById("app");
      const overlay = document.getElementById("overlay");
      const refreshBtn = document.getElementById("refreshBtn");

      const TZ_CANDIDATES = [
        "America/Los_Angeles",
        "America/Vancouver",
        "America/Denver",
        "America/Phoenix",
        "America/Chicago",
        "America/Mexico_City",
        "America/New_York",
        "America/Toronto",
        "America/Sao_Paulo",
        "Atlantic/Reykjavik",
        "Europe/London",
        "Europe/Dublin",
        "Europe/Paris",
        "Europe/Berlin",
        "Europe/Madrid",
        "Europe/Amsterdam",
        "Europe/Rome",
        "Africa/Johannesburg",
        "Asia/Dubai",
        "Asia/Kolkata",
        "Asia/Singapore",
        "Asia/Hong_Kong",
        "Asia/Tokyo",
        "Australia/Sydney",
        "Pacific/Auckland",
        "UTC",
      ];

      function showOverlay() {
        overlay.classList.add("visible");
        overlay.setAttribute("aria-hidden", "false");
      }

      refreshBtn.addEventListener("click", function () {
        window.location.reload();
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) showOverlay();
      });

      setTimeout(showOverlay, 15 * 60 * 1000);

      function extractOffset(value) {
        if (!value) return null;
        const m = String(value).match(/([+-]\d{2}:\d{2})$/);
        return m ? m[1] : null;
      }

      function normalizeOffsetLabel(label) {
        if (!label) return null;
        const m = String(label).match(/([+-])(\d{1,2})(?::?(\d{2}))?/);
        if (!m) return null;
        return m[1] + String(m[2]).padStart(2, "0") + ":" + String(m[3] || "00").padStart(2, "0");
      }

      function offsetAt(timeZone, date) {
        try {
          const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: timeZone,
            timeZoneName: "longOffset",
            hour: "numeric",
          }).formatToParts(date);
          const name = parts.find(function (p) { return p.type === "timeZoneName"; });
          return normalizeOffsetLabel(name && name.value);
        } catch (_) {
          return null;
        }
      }

      function guessTimeZone(utcOffset, instant) {
        if (!utcOffset) return null;
        for (var i = 0; i < TZ_CANDIDATES.length; i++) {
          var tz = TZ_CANDIDATES[i];
          if (offsetAt(tz, instant) === utcOffset) return tz;
        }
        return null;
      }

      function resolveZone(data) {
        var explicit = data.timeZone || null;
        var utcOffset = data.utcOffset || extractOffset(data.eventDate);
        var eventDate = data.eventDate ? new Date(data.eventDate) : new Date();
        if (isNaN(eventDate.getTime())) eventDate = new Date();

        if (explicit) {
          try {
            Intl.DateTimeFormat("en-US", { timeZone: explicit }).format(eventDate);
            return { timeZone: explicit, utcOffset: utcOffset || offsetAt(explicit, eventDate) };
          } catch (_) {}
        }

        var guessed = guessTimeZone(utcOffset, eventDate);
        return { timeZone: guessed, utcOffset: utcOffset };
      }

      function formatWhen(iso, zone) {
        if (!iso) return "—";
        try {
          var date = new Date(iso);
          if (isNaN(date.getTime())) return String(iso);

          if (zone.timeZone) {
            var parts = new Intl.DateTimeFormat("en-US", {
              timeZone: zone.timeZone,
              hour: "numeric",
              minute: "2-digit",
              hour12: true,
              timeZoneName: "short",
            }).formatToParts(date);
            var hour = parts.find(function (p) { return p.type === "hour"; });
            var minute = parts.find(function (p) { return p.type === "minute"; });
            var dayPeriod = parts.find(function (p) { return p.type === "dayPeriod"; });
            var tzName = parts.find(function (p) { return p.type === "timeZoneName"; });
            return (
              (hour ? hour.value : "") +
              ":" +
              (minute ? minute.value : "00") +
              " " +
              (dayPeriod ? dayPeriod.value.toLowerCase() : "") +
              (tzName ? " " + tzName.value.toLowerCase() : "")
            ).replace(/\s+/g, " ").trim();
          }

          // Fallback: wall-clock from ISO + offset label
          var m = String(iso).match(/T(\d{2}):(\d{2})/);
          if (m) {
            var h = parseInt(m[1], 10);
            var ampm = h >= 12 ? "pm" : "am";
            var h12 = h % 12 || 12;
            var off = (zone.utcOffset || "").toLowerCase();
            return h12 + ":" + m[2] + " " + ampm + (off ? " gmt" + off : "");
          }
          return date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
        } catch (_) {
          return String(iso);
        }
      }

      function formatClock(now, zone) {
        try {
          var opts = {
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
          };
          if (zone.timeZone) opts.timeZone = zone.timeZone;
          return now.toLocaleString("en-US", opts);
        } catch (_) {
          return now.toLocaleString("en-US");
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      var DICE_SEAL_SVG =
        '<svg viewBox="0 0 48 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<defs>' +
        '<linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#eef6ff"/>' +
        '<stop offset="20%" stop-color="#b7dbff"/>' +
        '<stop offset="45%" stop-color="#e4c4ff"/>' +
        '<stop offset="70%" stop-color="#ffc1dc"/>' +
        '<stop offset="100%" stop-color="#c8ffe8"/>' +
        "</linearGradient>" +
        "</defs>" +
        '<rect width="48" height="64" rx="7" fill="url(#holo)"/>' +
        '<g fill="#111" transform="translate(24 26)">' +
        // pleated fan (main DICE mascot shape)
        '<path d="M0-17 C-11-10 -15-1 -15.5 8 C-9 2.5 -4.5 0 0 0 C4.5 0 9 2.5 15.5 8 C15-1 11-10 0-17Z"/>' +
        '<path d="M0-14.5 C-3.2-10.8 -5.5-6.2 -6.8-1.2 C-4.5-2.4 -2.2-3 0-3 C2.2-3 4.5-2.4 6.8-1.2 C5.5-6.2 3.2-10.8 0-14.5Z" fill="#fff" opacity=".28"/>' +
        '<path d="M-10.5-2 C-7.8-7 -3.8-11.2 0-13.5 V-1.5 C-4-.8 -7.5.8 -10.5 3.2Z" fill="#fff" opacity=".16"/>' +
        '<path d="M10.5-2 C7.8-7 3.8-11.2 0-13.5 V-1.5 C4-.8 7.5.8 10.5 3.2Z" fill="#fff" opacity=".16"/>' +
        // arms out
        '<rect x="-14" y="2.2" width="9" height="2.1" rx="1" transform="rotate(-22 -9.5 3.2)"/>' +
        '<rect x="5" y="2.2" width="9" height="2.1" rx="1" transform="rotate(22 9.5 3.2)"/>' +
        // legs + shoes
        '<rect x="-7.2" y="9" width="3" height="9.5" rx="1.2"/>' +
        '<rect x="4.2" y="9" width="3" height="9.5" rx="1.2"/>' +
        '<rect x="-8.8" y="17" width="5.8" height="2.2" rx="1"/>' +
        '<rect x="3" y="17" width="5.8" height="2.2" rx="1"/>' +
        "</g>" +
        '<text x="24" y="58" text-anchor="middle" font-size="7.2" font-family="Arial Black, Helvetica, sans-serif" font-weight="800" letter-spacing="1.6" fill="#111">DICE</text>' +
        "</svg>";

      try {
        const data = DiceTicketTransfer.decodePayload(location.hash);
        const zone = resolveZone(data);
        const ticketType = data.ticketType || "Ticket";
        const when = formatWhen(data.eventDate, zone);
        const where = data.venueName || "—";
        const eventName = data.eventName || "";

        app.innerHTML =
          '<div class="shell">' +
          '<div class="ticket">' +
          '<div class="info-dot" aria-hidden="true">i</div>' +
          '<div class="ticket-top">' +
          '<div class="ticket-type">' + escapeHtml(ticketType) + "</div>" +
          '<div class="ticket-count">1 OF 1</div>' +
          "</div>" +
          '<div class="qr-wrap"><div class="qr-frame"><div id="qrcode" role="img" aria-label="Ticket QR Code"></div></div></div>' +
          '<div class="ticket-bottom">' +
          '<div class="meta">' +
          '<div class="meta-block"><div class="label">When</div><div class="value">' +
          escapeHtml(when) +
          "</div></div>" +
          '<div class="meta-block"><div class="label">Where</div><div class="value">' +
          escapeHtml(where) +
          "</div></div>" +
          "</div>" +
          '<div class="dice-seal" aria-hidden="true">' + DICE_SEAL_SVG + "</div>" +
          "</div>" +
          "</div>" +
          '<div class="event-under">' +
          (eventName
            ? '<div class="name">' + escapeHtml(eventName) + "</div>"
            : "") +
          '<div class="clock">Current time: ' +
          escapeHtml(formatClock(new Date(), zone)) +
          "</div>" +
          "</div>" +
          "</div>";

        new QRCode(document.getElementById("qrcode"), {
          text: String(data.barcode),
          width: 200,
          height: 200,
          correctLevel: QRCode.CorrectLevel.M,
        });

        var clockEl = document.querySelector(".event-under .clock");
        if (clockEl) {
          setInterval(function () {
            clockEl.textContent = "Current time: " + formatClock(new Date(), zone);
          }, 1000);
        }
      } catch (err) {
        app.innerHTML =
          '<div class="error"><h2>Unable to open ticket</h2><p>' +
          escapeHtml(err.message || "Invalid link") +
          "</p></div>";
      }
    })();
  </script>
</body>
</html>
